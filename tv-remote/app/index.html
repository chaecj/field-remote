<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HW 리모컨</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0b111b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* 레이아웃: 한 손 조작용 세로 콘솔. 위=TV 선택, 가운데=조작면, 아래=탭. 촬영장 빛 번짐을 줄이려 어두운 단일 테마, HW 로고의 블루 계열 */
:root {
  --bg: #0b111b;          /* 딥 네이비 */
  --panel: #121b2a;
  --key: #1a2638;
  --key-hi: #243550;
  --line: #2a3a52;
  --fg: #e9f0f8;
  --muted: #8d9db3;
  --accent: #5fa8e3;      /* HW 로고 블루 */
  --accent-2: #8fd0ea;    /* 로고 밝은 쪽 */
  --accent-deep: #3a6fc0; /* 로고 진한 쪽 */
  --accent-ink: #061322;
  --grad: linear-gradient(135deg, var(--accent-deep), var(--accent-2));
  --rec: #e5484d;         /* 탈리 레드 */
  --ok: #46a758;
  --warn: #d9a33a;
  --font-ui: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 14px;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 15px/1.45 var(--font-ui);
  overscroll-behavior: none;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button { font: inherit; color: inherit; }
.app {
  max-width: 480px; margin: 0 auto; min-height: 100%;
  display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px));
}

/* ---------- 상단 ---------- */
header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  padding-block: 12px 8px; display: grid; gap: 10px;
}
.titlebar { display: flex; align-items: center; gap: 10px; }
.titlebar h1 { font-size: 17px; margin: 0; letter-spacing: -0.01em; font-weight: 700; }
.brand { display: flex; align-items: center; gap: 6px; }
.brand img { height: 22px; width: auto; display: block; }
.titlebar .sub { color: var(--muted); font-size: 12px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.toggle {
  border: 1px solid var(--line); background: transparent; border-radius: 999px;
  padding: 5px 11px; font-size: 12.5px; color: var(--muted); cursor: pointer;
}
.toggle[aria-pressed="true"] { background: var(--grad); color: var(--accent-ink); border-color: transparent; font-weight: 700; }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; display: inline-flex; align-items: center; gap: 7px;
  border: 1px solid var(--line); background: var(--panel); border-radius: 10px;
  padding: 8px 12px; cursor: pointer; font-size: 14px; max-width: 70vw;
}
.chip .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip.sel { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.chip.flash { animation: flash 0.9s ease 2; }
@keyframes flash { 50% { background: var(--accent); color: var(--accent-ink); } }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.on { background: var(--ok); }
.dot.wait { background: var(--warn); }
.pill { font: 600 10px/1 var(--font-mono); padding: 3px 5px; border-radius: 4px; background: var(--key-hi); color: var(--muted); letter-spacing: 0.04em; }
.pill.ok { color: var(--ok); }
.chip.add { color: var(--accent); border-style: dashed; }

.banner {
  border: 1px solid var(--warn); background: color-mix(in srgb, var(--warn) 12%, var(--bg));
  border-radius: 12px; padding: 12px 14px; font-size: 13.5px; display: grid; gap: 8px;
}
.banner b { color: var(--warn); }
.banner.upd { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--bg)); }
.recbar {
  display: flex; align-items: center; gap: 10px; border-radius: 12px; padding: 10px 12px;
  background: color-mix(in srgb, var(--rec) 16%, var(--bg)); border: 1px solid var(--rec); font-size: 13.5px;
}
.recbar .r { width: 10px; height: 10px; border-radius: 50%; background: var(--rec); animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0.2; } }
.recbar .grow { flex: 1; }

/* ---------- 버튼 ---------- */
.key {
  background: linear-gradient(180deg, var(--key-hi), var(--key)); border: 1px solid transparent;
  box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.06), 0 1px 2px rgb(0 0 0 / 0.35); border-radius: var(--r);
  min-height: 52px; display: grid; place-items: center; gap: 2px; cursor: pointer;
  font-size: 14px; font-weight: 600; touch-action: manipulation; user-select: none; -webkit-user-select: none;
  transition: background 0.08s, transform 0.08s;
}
.key small { font-weight: 500; font-size: 11px; color: var(--muted); }
.key:active, .key.pressed { background: var(--key-hi); transform: scale(0.97); }
.key:focus-visible, .toggle:focus-visible, .chip:focus-visible, .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.key.power { color: #fff; background: linear-gradient(180deg, color-mix(in srgb, var(--rec) 85%, #fff), var(--rec)); }
.key.accent { background: var(--grad); color: var(--accent-ink); }
.key svg { width: 22px; height: 22px; }
.edit-mode .key[data-act] { border-color: var(--accent); border-style: dashed; }

.grid { display: grid; gap: 10px; }
.g4 { grid-template-columns: repeat(4, 1fr); }
.g3 { grid-template-columns: repeat(3, 1fr); }
.g7 { grid-template-columns: repeat(7, 1fr); gap: 6px; }
.g7 .key { min-height: 46px; border-radius: 11px; }

section.view { display: grid; gap: 16px; padding-top: 8px; }
.label { font-size: 11.5px; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }

/* D-pad */
.pad-wrap { display: grid; grid-template-columns: 64px 1fr 64px; gap: 12px; align-items: center; }
.dpad {
  position: relative; width: 100%; max-width: 236px; aspect-ratio: 1; margin: 0 auto;
  border-radius: 50%; background: radial-gradient(circle at 50% 35%, var(--key-hi), var(--panel) 70%); border: 1px solid var(--line);
}
.dpad .key { position: absolute; background: transparent; min-height: 0; border-radius: 12px; box-shadow: none; }
.dpad .key:active, .dpad .key.pressed { background: var(--key-hi); }
.dpad .dp-up { top: 4%; left: 34%; width: 32%; height: 28%; }
.dpad .dp-down { bottom: 4%; left: 34%; width: 32%; height: 28%; }
.dpad .dp-left { left: 4%; top: 34%; width: 28%; height: 32%; }
.dpad .dp-right { right: 4%; top: 34%; width: 28%; height: 32%; }
.dpad .dp-ok { left: 31%; top: 31%; width: 38%; height: 38%; border-radius: 50%; background: var(--key); font-size: 15px; }
.dpad .dp-ok { background: var(--grad); color: var(--accent-ink); font-weight: 700; }
.dpad .dp-ok:active, .dpad .dp-ok.pressed { background: var(--accent-2); }
.rocker { display: grid; grid-template-rows: 1fr auto 1fr; background: linear-gradient(180deg, var(--key-hi), var(--key)); box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.06); border-radius: 32px; overflow: hidden; height: 180px; }
.rocker .key { box-shadow: none; background: transparent; border-radius: 0; min-height: 0; font-size: 22px; font-weight: 500; }
.rocker .key:active, .rocker .key.pressed { background: var(--key-hi); }
.rocker .cap { text-align: center; font-size: 11px; color: var(--muted); padding: 2px 0; }
.side3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }

details.more { border-top: 1px solid var(--line); padding-top: 12px; }
details.more summary { cursor: pointer; color: var(--muted); font-size: 13.5px; list-style: none; display: flex; justify-content: space-between; }
details.more summary::after { content: "펼치기"; font-size: 12px; }
details.more[open] summary::after { content: "접기"; }
details.more .grid { margin-top: 12px; }

/* 터치패드 */
.pad-view { gap: 12px; }
.typebar { display: flex; gap: 8px; align-items: stretch; }
.typebar input { flex: 1; min-width: 0; height: 48px; font-size: 16px; }
.typebar .btn { height: 48px; padding-inline: 16px; }
.hanpill {
  width: 48px; flex: none; border-radius: 12px; border: 1px solid var(--line); cursor: pointer;
  background: linear-gradient(180deg, var(--key-hi), var(--key)); font-weight: 800; font-size: 17px; color: var(--accent-2);
}
.hanpill.ko { color: var(--accent-ink); background: var(--grad); border-color: transparent; }
.typekeys { display: grid; grid-template-columns: 1.2fr 1.3fr 1fr 1fr 0.9fr; gap: 6px; }
.typekeys .key { min-height: 40px; font-size: 13px; border-radius: 11px; }
.typekeys .key.ghost { background: transparent; box-shadow: none; border-color: var(--line); color: var(--muted); }
.typekeys .key svg { width: 18px; height: 18px; }
.padbox { border: 1px solid var(--line); border-radius: 20px; overflow: hidden; background: var(--panel); }
.touchpad {
  height: calc(100vh - 380px); min-height: 220px; max-height: 520px;
  touch-action: none; position: relative; display: grid; place-items: center;
  background-image: radial-gradient(circle, color-mix(in srgb, var(--accent) 22%, transparent) 1px, transparent 1.4px); background-size: 24px 24px;
}
.touchpad.active { background-color: color-mix(in srgb, var(--accent) 6%, var(--panel)); }
.padhint { color: var(--muted); font-size: 12px; pointer-events: none; opacity: 0.8; }
.touchpad.active .padhint { opacity: 0; }
.sens { position: absolute; top: 10px; right: 10px; display: flex; gap: 2px; padding: 3px; border-radius: 999px; background: color-mix(in srgb, var(--bg) 70%, transparent); }
.sens button { border: 0; background: transparent; color: var(--muted); font-size: 11.5px; padding: 5px 9px; border-radius: 999px; cursor: pointer; }
.sens button[aria-pressed="true"] { background: var(--key-hi); color: var(--fg); font-weight: 700; }
.padbtns { display: grid; grid-template-columns: 1fr 0.8fr 1fr; border-top: 1px solid var(--line); }
.padbtns button { border: 0; background: transparent; height: 56px; font-weight: 600; font-size: 14px; cursor: pointer; touch-action: manipulation; }
.padbtns button + button { border-left: 1px solid var(--line); }
.padbtns button:active { background: var(--key-hi); }
.padbtns #dragBtn { font-size: 12.5px; color: var(--muted); }
.padbtns #dragBtn[aria-pressed="true"] { background: var(--grad); color: var(--accent-ink); font-weight: 700; }
.row { display: flex; gap: 10px; align-items: center; }
.row > * { min-width: 0; }
.grow { flex: 1; }
input[type=text], input[type=number], select, textarea {
  font: inherit; color: var(--fg); background: var(--key); border: 1px solid var(--line); border-radius: 10px;
  padding: 11px 12px; width: 100%;
}
textarea { font-family: var(--font-mono); font-size: 12.5px; min-height: 84px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
input[type=range] { width: 100%; accent-color: var(--accent); }
.btn {
  border: 1px solid var(--line); background: var(--key); border-radius: 10px; padding: 10px 14px; cursor: pointer; font-weight: 600; font-size: 14px;
  white-space: nowrap;
}
.btn.primary { background: var(--grad); color: var(--accent-ink); border-color: transparent; }
.btn.danger { color: var(--rec); }
.btn.sm { padding: 7px 10px; font-size: 13px; }
.btn:disabled { opacity: 0.45; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: grid; gap: 12px; }
.card h2 { font-size: 15px; margin: 0; }
.card p { margin: 0; color: var(--muted); font-size: 13.5px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13.5px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-family: var(--font-mono); font-size: 12.5px; min-width: 0; overflow-wrap: anywhere; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--key); border-radius: 10px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: transparent; border-radius: 8px; padding: 8px 4px; cursor: pointer; font-size: 13.5px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--key-hi); color: var(--fg); font-weight: 700; }
.tips { margin: 0; padding-left: 18px; color: var(--muted); font-size: 13.5px; display: grid; gap: 6px; }
.tips b { color: var(--fg); font-weight: 600; }
.macro { display: flex; gap: 8px; align-items: center; background: var(--key); border-radius: 12px; padding: 8px 8px 8px 12px; }
.macro .nm { flex: 1; min-width: 0; }
.macro .nm small { display: block; color: var(--muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mult { display: flex; gap: 6px; }
.mult button { flex: 1; }
.empty { color: var(--muted); font-size: 13.5px; padding: 10px 0; }

/* 하단 탭 */
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
  background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(10px);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}
nav.tabs .in { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }

/* 클리커 */
.seg.two { grid-template-columns: repeat(2, 1fr); }
.hint { margin: 0; color: var(--muted); font-size: 13px; }
.clk-view { gap: 12px; }
.pic-view { gap: 12px; }
.adj { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; height: 150px; }
.adjbtn { border-radius: 22px; font-size: 14px; gap: 2px; align-content: center; }
.adjbtn span { font-size: 44px; line-height: 1; font-weight: 400; }
.adjfoot { display: flex; align-items: center; gap: 8px; }
.sens.static { position: static; background: var(--panel); border: 1px solid var(--line); }
.pathrow { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); font-size: 13.5px; }
.pathrow .grow small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
.pathrow.todo { border-color: var(--accent); border-style: dashed; }
.minipad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.minipad .key { min-height: 50px; }
.minipad .dpok { background: var(--grad); color: var(--accent-ink); }
.tiplink { border: 0; background: none; color: var(--muted); font-size: 13px; text-decoration: underline; text-underline-offset: 3px; padding: 6px 0; cursor: pointer; justify-self: center; }
select.slim { padding: 9px 12px; font-size: 14px; color: var(--muted); }
.clicker { display: grid; grid-template-columns: 2fr 3fr; gap: 10px; height: calc(100vh - 420px); min-height: 240px; max-height: 520px; }
.cbig { font-size: 16px; border-radius: 24px; align-content: center; gap: 6px; }
.cbig svg { width: 44px; height: 44px; }
#clkKeys .key { min-height: 48px; }
.volrow { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); font-size: 14px; font-weight: 600; }
.volrow small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; margin-top: 2px; }
nav.tabs button { border: 0; background: transparent; padding: 10px 0 12px; display: grid; justify-items: center; gap: 3px; font-size: 11.5px; color: var(--muted); cursor: pointer; }
nav.tabs button svg { width: 22px; height: 22px; }
nav.tabs button[aria-selected="true"] { color: var(--accent); font-weight: 700; }

/* 시트 */
.scrim { position: fixed; inset: 0; background: rgb(0 0 0 / 0.55); z-index: 20; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-height: 86vh; overflow: auto;
  background: var(--panel); border-radius: 20px 20px 0 0; border-top: 1px solid var(--line);
  padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.sheet .in { max-width: 480px; margin: 0 auto; display: grid; gap: 14px; }
.sheet h3 { margin: 0; font-size: 17px; }
.sheet .opt { display: flex; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.sheet .opt:last-child { border-bottom: 0; }
.sheet .opt .nm { flex: 1; min-width: 0; font-size: 14px; }
.sheet .opt .nm code { display: block; font: 11.5px var(--font-mono); color: var(--muted); }
.sheet .cur { color: var(--accent); font-size: 12px; font-weight: 700; }
.list-scroll { max-height: 34vh; overflow: auto; }
.big-step { font-size: 15px; display: grid; gap: 4px; }
.big-step strong { font-size: 22px; }

.toast {
  position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--fg); color: var(--bg); border-radius: 10px; padding: 9px 14px; font-size: 13.5px; z-index: 30;
  max-width: calc(100% - 32px); box-shadow: 0 6px 24px rgb(0 0 0 / 0.35);
}
.hidlog { margin: 0; font: 11.5px/1.5 var(--font-mono); color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }
.log { font: 11.5px var(--font-mono); color: var(--muted); min-height: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---------- 가로 화면 (태블릿·휴대폰 가로): 2단 배치 ---------- */
@media (orientation: landscape) and (min-width: 700px) {
  .app { max-width: 1180px; padding-bottom: calc(68px + env(safe-area-inset-bottom, 0px)); }
  nav.tabs .in { max-width: 720px; }
  nav.tabs button { padding: 7px 0 9px; }
  section.view { grid-template-columns: 1fr 1fr; column-gap: 20px; align-items: start; grid-auto-flow: row dense; }
  section.view > * { grid-column: 2; min-width: 0; }

  /* 리모컨: 왼쪽 = 전원줄 + 방향키, 오른쪽 = 나머지 */
  #v-remote > .g4:first-child, #v-remote > .pad-wrap { grid-column: 1; }
  #v-remote > .pad-wrap { grid-row: 2 / span 2; }
  #v-remote .dpad { max-width: 300px; }
  #v-remote .rocker { height: 220px; }
  #v-remote .log { grid-column: 1 / -1; }

  /* 터치패드: 왼쪽 = 글자 입력, 오른쪽 = 패드 */
  .pad-view > .typebar, .pad-view > .typekeys { grid-column: 1; }
  .pad-view > .padbox { grid-row: 1 / span 3; }
  .pad-view .touchpad { height: calc(100vh - 260px); max-height: none; min-height: 200px; }

  /* 클리커: 왼쪽 = 설정·보조 버튼, 오른쪽 = 이전/다음 */
  .clk-view > #clkMode, .clk-view > #clkProg, .clk-view > #clkKeys, .clk-view > #volCard { grid-column: 1; }
  .clk-view > .clicker { grid-row: 1 / span 5; height: calc(100vh - 220px); max-height: none; min-height: 200px; }

  /* 화면 조정: 왼쪽 = 밝기·명암 조절, 오른쪽 = 메뉴 이동 */
  .pic-view > #picTarget, .pic-view > .adj, .pic-view > .adjfoot, .pic-view > #pathRow { grid-column: 1; }
  .pic-view > .minipad { grid-row: 1 / span 4; }
  .pic-view > .tiplink { justify-self: center; }

  /* TV 설정: 카드 2열 */
  #v-set { grid-template-columns: 1fr; }
  #v-set > * { grid-column: 1; }
  #setBody { grid-template-columns: 1fr 1fr; align-items: start; }

  .sheet .in { max-width: 560px; }
}
/* 높이가 낮은 가로 화면(휴대폰 가로)에서는 큰 버튼을 조금 줄임 */
@media (orientation: landscape) and (max-height: 500px) {
  header.top { padding-block: 6px 4px; gap: 6px; }
  .adj { height: 110px; }
  #v-remote .rocker { height: 170px; }
  #v-remote .dpad { max-width: 210px; }
}
</style>
</head>
<body>
<div class="app" id="app">

<script>
'use strict';
/* =========================================================
   HW 리모컨 — 휴대폰(블루투스) → AtomS3 동글 → TV (USB 키보드·마우스 + IR)
   ========================================================= */
const SVC  = '7e1a0001-5c2b-4f3a-9e7d-3c1b8a9f0a11';
const CMD  = '7e1a0002-5c2b-4f3a-9e7d-3c1b8a9f0a11';

const OP = { KEY_TAP:0x01, KEY_ALLUP:0x04, TEXT:0x05, MOVE:0x06, CLICK:0x07, MDOWN:0x08, MUP:0x09,
             CC_TAP:0x0A, SYS:0x0D, IR:0x20, IR_BEGIN:0x30, IR_DATA:0x31, IR_END:0x32, IDENTIFY:0x40, SET_NAME:0x41, BT_FORGET:0x42, USB_COMPAT:0x43,
             OTA_BEGIN:0x50, OTA_DATA:0x51, OTA_END:0x52, OTA_ABORT:0x53 };

/* ---------------- IR 인코더 ---------------- */
function pdm(hdr, bytes, bitMark, one, zero) {
  const s = hdr.slice();
  for (const b of bytes) for (let i = 0; i < 8; i++) s.push(bitMark, (b >> i) & 1 ? one : zero);
  s.push(bitMark);
  return s;
}
function mergeLevels(levels) {
  const out = [];
  for (const [l, d] of levels) {
    if (out.length && out[out.length - 1][0] === l) out[out.length - 1][1] += d;
    else out.push([l, d]);
  }
  while (out.length && out[0][0] === 0) out.shift();
  while (out.length && out[out.length - 1][0] === 0) out.pop();
  return out.map(x => x[1]);
}
const IR = {
  nec(addr, cmd) {
    const a = addr > 0xFF ? [addr & 0xFF, addr >> 8] : [addr, (~addr) & 0xFF];
    return { khz: 38, seq: pdm([9000, 4500], [...a, cmd, (~cmd) & 0xFF], 560, 1690, 560), repeat: 0, gap: 40 };
  },
  samsung(addr, cmd) {
    return { khz: 38, seq: pdm([4500, 4500], [addr, addr, cmd, (~cmd) & 0xFF], 560, 1690, 560), repeat: 0, gap: 40 };
  },
  sony(addr, cmd, bits = 12) {
    const nb = bits === 15 ? 8 : bits === 20 ? 13 : 5;
    const seq = [2400, 600];
    for (let i = 0; i < 7; i++) seq.push((cmd >> i) & 1 ? 1200 : 600, 600);
    for (let i = 0; i < nb; i++) seq.push((addr >> i) & 1 ? 1200 : 600, 600);
    const total = seq.reduce((a, b) => a + b, 0);
    return { khz: 40, seq, repeat: 2, gap: Math.max(10, Math.round((45000 - total) / 1000)) };
  },
  kaseikyo(bytes) {
    const T = 432;
    return { khz: 37, seq: pdm([8 * T, 4 * T], bytes, T, 3 * T, T), repeat: 0, gap: 74 };
  },
  rc6(addr, cmd, toggle) {
    const T = 444, L = [[1, 6 * T], [0, 2 * T]];
    const bit = (v, w = 1) => v ? [[1, T * w], [0, T * w]] : [[0, T * w], [1, T * w]];
    L.push(...bit(1));
    for (let i = 0; i < 3; i++) L.push(...bit(0));
    L.push(...bit(toggle ? 1 : 0, 2));
    for (let i = 7; i >= 0; i--) L.push(...bit((addr >> i) & 1));
    for (let i = 7; i >= 0; i--) L.push(...bit((cmd >> i) & 1));
    return { khz: 36, seq: mergeLevels(L), repeat: 0, gap: 0 };
  },
  rc5(addr, cmd, toggle) {
    const T = 889, bits = [1, (cmd & 0x40) ? 0 : 1, toggle ? 1 : 0];
    for (let i = 4; i >= 0; i--) bits.push((addr >> i) & 1);
    for (let i = 5; i >= 0; i--) bits.push((cmd >> i) & 1);
    const L = [];
    for (const b of bits) L.push(...(b ? [[0, T], [1, T]] : [[1, T], [0, T]]));
    return { khz: 36, seq: mergeLevels(L), repeat: 0, gap: 0 };
  }
};
function parsePronto(text) {
  const w = text.trim().split(/[\s,]+/).filter(Boolean).map(h => parseInt(h, 16));
  if (w.length < 6 || w.some(Number.isNaN) || w[0] !== 0)
    throw new Error('Pronto 코드는 0000으로 시작하는 16진수 묶음이에요.');
  const freq = 1000000 / (w[1] * 0.241246), unit = 1e6 / freq;
  const n1 = w[2], n2 = w[3];
  const pairs = n1 ? w.slice(4, 4 + 2 * n1) : w.slice(4, 4 + 2 * n2);
  if (pairs.length < 4) throw new Error('신호 길이가 너무 짧아요. 코드를 다시 확인해 주세요.');
  return { khz: Math.max(30, Math.min(60, Math.round(freq / 1000))), seq: pairs.map(c => Math.max(1, Math.round(c * unit))), repeat: 0, gap: 40 };

/* ---------------- 브랜드별 IR 코드 ---------------- */
const digits = (base) => Object.fromEntries([...Array(10)].map((_, i) => ['d' + i, base(i)]));

/* ---------------- 시트 ---------------- */
function openSheet(html, onMount) {
  const root = $('#sheetRoot');
  root.innerHTML = `<div class="scrim"></div><div class="sheet" role="dialog" aria-modal="true"><div class="in">${html}</div></div>`;
  const close = () => { root.innerHTML = ''; };
  $('.scrim', root).onclick = close;
  onMount && onMount($('.sheet', root), close);
  return close;
}
function confirmSheet(title, text, okLabel, onOk) {
  openSheet(`<h3>${esc(title)}</h3><p style="margin:0;color:var(--muted)">${esc(text)}</p>
    <div class="row"><button class="btn grow" data-x>취소</button><button class="btn danger grow" data-ok>${esc(okLabel)}</button></div>`,
    (s, close) => { $('[data-x]', s).onclick = close; $('[data-ok]', s).onclick = () => { close(); onOk(); }; });
}

function openReassign(act) {
  const d = dongles.get(current);
  if (!d) { ui.toast('TV를 먼저 선택해 주세요.'); return; }
  const c = cfgOf(d.id), cur = resolve(d, act);
  const lab = ACTIONS[act] ? ACTIONS[act].label : act;
  const brandFirst = c.brand || 'samsung';
  const brandSel = BRAND_ORDER.map(k => `<option value="${k}" ${k === brandFirst ? 'selected' : ''}>${BRANDS[k].label}</option>`).join('');
  const hidRows = HID_CHOICES.map(([n, v], i) => `<div class="opt"><span class="nm">${esc(n)}</span>
    <button class="btn sm" data-try-hid="${i}">보내 보기</button><button class="btn sm primary" data-set-hid="${i}">이걸로</button></div>`).join('');
  openSheet(`
    <h3>‘${esc(lab)}’ 버튼 바꾸기</h3>
    <p style="margin:0;color:var(--muted)">지금: <span class="cur">${esc(describe(cur))}</span>. ‘보내 보기’로 TV 반응을 확인한 뒤 ‘이걸로’를 누르세요.</p>
    <span class="label">IR 코드</span>
    <div class="row"><select id="rBrand" class="grow" aria-label="브랜드">${brandSel}</select><select id="rCode" class="grow" aria-label="코드"></select></div>
    <div class="row"><button class="btn grow" id="rTryIr">보내 보기</button><button class="btn primary grow" id="rSetIr">이걸로</button></div>
    <span class="label">USB 키</span>
    <div class="list-scroll">${hidRows}</div>

    <textarea id="rPronto" placeholder="0000 006D 0022 0002 0157 00AC ..." spellcheck="false"></textarea>
    <div class="row"><button class="btn grow" id="rTryP">보내 보기</button><button class="btn primary grow" id="rSetP">이걸로</button></div>
    <div class="row"><button class="btn grow" id="rReset">기본값으로</button><button class="btn grow" id="rClose">닫기</button></div>`,
  (s, close) => {
    const fillCodes = () => {
      const b = BRANDS[$('#rBrand', s).value];
      $('#rCode', s).innerHTML = Object.keys(b.codes).map(a => `<option value="${a}" ${a === act ? 'selected' : ''}>${ACTIONS[a] ? ACTIONS[a].label : a}</option>`).join('');
    };
    fillCodes(); $('#rBrand', s).onchange = fillCodes;
    const irM = () => ({ type: 'ir', brand: $('#rBrand', s).value, act: $('#rCode', s).value });
    const tryM = (m) => { if (d.state !== 'on') { ui.toast('연결된 상태에서만 보낼 수 있어요.'); return; } exec(d, m).then(() => ui.toast('보냈어요')).catch(() => ui.toast('보내지 못했어요')); };
    const setM = (m) => { c.overrides[act] = m; save(); close(); ui.render(); ui.toast(`‘${lab}’ → ${describe(m)}`); };
    $('#rTryIr', s).onclick = () => tryM(irM());
    $('#rSetIr', s).onclick = () => setM(irM());
    $$('[data-try-hid]', s).forEach(b => b.onclick = () => tryM({ type: 'hid', ...HID_CHOICES[+b.dataset.tryHid][1] }));
    $$('[data-set-hid]', s).forEach(b => b.onclick = () => setM({ type: 'hid', ...HID_CHOICES[+b.dataset.setHid][1] }));
    const pr = () => { const code = $('#rPronto', s).value; parsePronto(code); return { type: 'pronto', code }; };
    $('#rTryP', s).onclick = () => { try { tryM(pr()); } catch (e) { ui.toast(e.message); } };
    $('#rSetP', s).onclick = () => { try { setM(pr()); } catch (e) { ui.toast(e.message); } };
    $('#rReset', s).onclick = () => { delete c.overrides[act]; save(); close(); ui.render(); ui.toast('기본값으로 되돌렸어요'); };
    $('#rClose', s).onclick = close;
  });
}

function openBrandFinder(d) {
  let i = 0;
  const c = cfgOf(d.id);
  const step = (s) => {
    if (i >= BRAND_ORDER.length) {
      $('.in', s).innerHTML = `<h3>목록에 없는 TV예요</h3>
        <p style="margin:0;color:var(--muted)">USB(마우스·키보드)로 메뉴를 조작하면 됩니다. 전원·외부입력 IR이 꼭 필요하면 인터넷에서 ‘모델명 Pronto’ 코드를 찾아 버튼 다시 지정에 붙여 넣으세요.</p>
        <button class="btn primary" data-x>닫기</button>`;
      $('[data-x]', s).onclick = () => $('#sheetRoot').innerHTML = '';
      return;
    }
    const k = BRAND_ORDER[i];
    $('.in', s).innerHTML = `<h3>브랜드 찾기</h3>
      <div class="big-step"><span class="label">${i + 1} / ${BRAND_ORDER.length}</span><strong>${BRANDS[k].label}</strong>
      <span style="color:var(--muted)">전원 신호를 보냈어요. TV가 꺼지거나 켜졌나요?</span></div>
      <button class="btn primary" data-yes>반응했어요 · 이 브랜드로 저장</button>
      <div class="row"><button class="btn grow" data-again>다시 보내기</button><button class="btn grow" data-next>반응 없음 · 다음</button></div>
      <button class="btn" data-x>그만하기</button>`;
    const fire = () => exec(d, { type: 'ir', brand: k, act: 'power' }).catch(() => ui.toast('동글 연결을 확인해 주세요.'));
    fire();
    $('[data-yes]', s).onclick = () => { c.brand = k; save(); $('#sheetRoot').innerHTML = ''; ui.render(); ui.toast(`${BRANDS[k].label}로 저장했어요. 전원을 한 번 더 눌러 원래대로 돌려 주세요.`); };
    $('[data-again]', s).onclick = fire;
    $('[data-next]', s).onclick = () => { i++; step(s); };
    $('[data-x]', s).onclick = () => $('#sheetRoot').innerHTML = '';
  };
  openSheet(`<h3>브랜드 찾기</h3><p style="margin:0;color:var(--muted)">TV가 켜진 상태에서 시작하세요. 브랜드별 전원 신호를 하나씩 보냅니다. TV가 꺼지면 그 브랜드예요.</p>
    <button class="btn primary" data-go>시작</button>`, (s) => { $('[data-go]', s).onclick = () => step(s); });
}

/* ---------------- 동글 추가 / 재연결 ---------------- */
function btProblem() {
  if (NATIVE) return null;
  if (!('bluetooth' in navigator)) return '이 브라우저에서는 블루투스를 쓸 수 없어요. 안드로이드 <b>크롬</b>에서 https 주소로 열어 주세요 (삼성 인터넷은 지원하지 않아요).';
  try {
    const pp = document.permissionsPolicy || document.featurePolicy;
    if (pp && pp.allowsFeature && !pp.allowsFeature('bluetooth')) return '이 미리보기 화면에서는 블루투스가 막혀 있어요. 설치 안내대로 앱 주소를 크롬에서 직접 열어 주세요.';
  } catch (e) {}
  return null;
}
async function addDongle() {
  if (NATIVE) { openScanSheet(); return; }
  const p = btProblem();
  if (p) { ui.toast('블루투스를 쓸 수 없는 화면이에요. 데모 TV로 둘러볼 수 있어요.'); return; }
  let device;
  try { device = await navigator.bluetooth.requestDevice({ filters: [{ services: [SVC] }], optionalServices: [SVC] }); }
  catch (e) { if (e.name !== 'NotFoundError') ui.toast('블루투스를 켜고 다시 시도해 주세요.'); return; }
  let d = dongles.get(device.id);
  if (!d) { d = new Dongle(device); dongles.set(d.id, d); }
  current = d.id; if (groupMode) selected.add(d.id);
  try { await d.connect(); ui.toast(`‘${ui.name(d)}’ 연결됨`); }
  catch (e) { ui.toast('연결하지 못했어요. 동글을 휴대폰 가까이 두고 다시 시도해 주세요.'); }
}
async function restore() {
  if (NATIVE) { restoreNative(); return; }
  if (btProblem() || !navigator.bluetooth.getDevices) return;
  let list = [];
  try { list = await navigator.bluetooth.getDevices(); } catch (e) { return; }
  for (const device of list) {
    if (!store.tvs[device.id]) continue;
    const d = new Dongle(device); dongles.set(d.id, d);
    if (!current) current = d.id;
    if (device.watchAdvertisements) {
      const once = () => { device.removeEventListener('advertisementreceived', once); d.connect().catch(() => {}); };
      device.addEventListener('advertisementreceived', once);
      device.watchAdvertisements().catch(() => d.connect().catch(() => {}));
    } else d.connect().catch(() => {});
  }
  ui.render();
}
/* ---------------- 안드로이드 앱 연동 ---------------- */
let scanSink = null;
function openScanSheet() {
  const found = new Map();
  const closeAll = openSheet(`<h3>동글 찾기</h3>
    <p style="margin:0;color:var(--muted)">동글 LED가 파란색이면 목록에 나타나요. 휴대폰 가까이 두세요.</p>
    <div id="scanList" class="grid"><div class="empty">찾는 중…</div></div>
    <div class="row"><button class="btn grow" data-again>다시 찾기</button><button class="btn grow" data-x>닫기</button></div>`,
    (s, close) => {
      $('[data-x]', s).onclick = () => { Native.stopScan(); scanSink = null; close(); };
      $('[data-again]', s).onclick = () => { found.clear(); draw(); Native.scan(); };
    });
  const draw = () => {
    const box = $('#scanList'); if (!box) return;
    if (!found.size) { box.innerHTML = '<div class="empty">찾는 중…</div>'; return; }
    box.innerHTML = '';
    for (const [addr, f] of found) {
      const known = dongles.has(addr);
      const row = document.createElement('div'); row.className = 'macro';
      row.innerHTML = `<div class="nm">${esc(f.name || '동글')}<small>${esc(addr)} · 신호 ${f.rssi}</small></div>
        <button class="btn sm primary">${known ? '다시 연결' : '연결'}</button>`;
      $('button', row).onclick = () => { Native.stopScan(); scanSink = null; closeAll(); connectNative(addr, f.name); };
      box.appendChild(row);
    }
  };
  scanSink = (addr, name, rssi) => { found.set(addr, { name, rssi }); draw(); };
  Native.scan();
}
function connectNative(addr, name) {
  let d = dongles.get(addr);

/* ---------------- 동글 무선 펌웨어 업데이트 ---------------- */
const fw = {
  URL: 'https://raw.githubusercontent.com/chaecj/field-remote/main/tv-remote/firmware/latest.json',
  latest: null, busy: null, pct: 0, checking: false,
  newer(a, b) { const x = String(a || '0').split('.').map(Number), y = String(b || '0').split('.').map(Number);
    for (let i = 0; i < 3; i++) { if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) > (y[i] || 0); } return false; },
  async check() {
    if (this.checking) return; this.checking = true;
    try { const r = await fetch(this.URL + '?t=' + Date.now(), { cache: 'no-store' }); if (r.ok) this.latest = await r.json(); } catch (e) {}
    this.checking = false; this.refresh();
  },
  rowHtml(d) {
    const cur = d.fw || '?';
    if (this.busy === d.id) return `v${esc(cur)} · <b id="fwPct">보내는 중 ${this.pct}%</b> <button class="btn sm" id="fwStop">중단</button>`;
    if (d.otaMsg && d.otaMsg.startsWith('err')) return `v${esc(cur)} · 업데이트 실패 (${esc(d.otaMsg.slice(4))}) <button class="btn sm primary" id="fwGo">다시 시도</button>`;
    if (!this.latest) return `v${esc(cur)}`;
    if (d.state === 'on' && this.newer(this.latest.version, cur)) {
      const old = !d.fw || this.newer('1.3.0', cur);
      return old ? `v${esc(cur)} · 새 버전 ${esc(this.latest.version)}은 PC로 한 번 넣어야 해요 (이후부터 무선 업데이트)`
                 : `v${esc(cur)} → <b>${esc(this.latest.version)}</b> <button class="btn sm primary" id="fwGo">무선 업데이트</button>`;
    }
    return `v${esc(cur)} · 최신`;
  },
  refresh() { const d = dongles.get(current), row = $('#fwRow'); if (d && row) { row.innerHTML = this.rowHtml(d); this.bind(d); } },
  bind(d) {
    const go = $('#fwGo'); if (go) go.onclick = () => this.update(d);
    const st = $('#fwStop'); if (st) st.onclick = () => { this.stop = true; };
    if (!this.latest && !this.checking) this.check();
  },
  async update(d) {
    if (this.busy) return;
    if (d.state !== 'on') { ui.toast('동글이 연결된 상태에서만 할 수 있어요.'); return; }
    this.busy = d.id; this.pct = 0; this.stop = false; this.refresh();
    try {
      const r = await fetch(this.latest.url + '?t=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) throw new Error('파일을 받지 못했어요');
      const bin = new Uint8Array(await r.arrayBuffer());
      if (this.latest.size && bin.length !== this.latest.size) throw new Error('받은 파일 크기가 달라요');
      const n = bin.length;
      await d.write([OP.OTA_BEGIN, n & 255, (n >> 8) & 255, (n >> 16) & 255, (n >>> 24) & 255], true);
      await sleep(300);
      if (d.otaMsg.startsWith('err')) throw new Error(d.otaMsg.slice(4));
      const chunk = Math.max(16, d.payloadMax - 1);
      for (let i = 0; i < n; i += chunk) {
        if (this.stop) { d.write([OP.OTA_ABORT], true); throw new Error('중단했어요'); }
        if (d.state !== 'on') throw new Error('연결이 끊겼어요');
        const part = bin.subarray(i, i + chunk), pkt = new Uint8Array(part.length + 1);
        pkt[0] = OP.OTA_DATA; pkt.set(part, 1);
        if (d.native) { d.write(pkt, true); while (d.pending > 6) await sleep(8); }
        else await d.write(pkt, true);
        const pct = Math.floor((i + part.length) * 100 / n);
        if (pct !== this.pct) { this.pct = pct; const el = $('#fwPct'); if (el) el.textContent = `보내는 중 ${pct}%`; }
        if (d.otaMsg.startsWith('err')) throw new Error(d.otaMsg.slice(4));
      }
      if (d.native) while (d.pending > 0) await sleep(20);
      await d.write([OP.OTA_END], true);
      ui.toast('업데이트 완료! 동글이 다시 시작하고 곧 다시 연결돼요.');
    } catch (e) {
      ui.toast('펌웨어 업데이트 실패: ' + (e.message || e));
    } finally { this.busy = null; setTimeout(() => this.refresh(), 300); }
  },
};

function bindKeys() {
  const press = (btn, fire) => {
    let t1, t2;
    const stop = () => { clearTimeout(t1); clearInterval(t2); btn.classList.remove('pressed'); };
    btn.addEventListener('pointerdown', (e) => {
      if (ui.editMode && btn.dataset.act) { e.preventDefault(); openReassign(btn.dataset.act); return; }
      btn.classList.add('pressed'); fire();
      if (btn.hasAttribute('data-repeat')) {
        t1 = setTimeout(() => { t2 = setInterval(() => { if (targets().every(d => d.pending < 3)) fire(); }, 120); }, 420);
      }
    });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => btn.addEventListener(ev, stop));
    btn.addEventListener('contextmenu', e => e.preventDefault());
    btn.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fire(); } });
  };
  $$('[data-act]').forEach(b => press(b, () => runAction(b.dataset.act)));
  $$('[data-kb]').forEach(b => press(b, () => sendRaw(d => d.write([OP.KEY_TAP, +b.dataset.kb, 0]))));
}

// 영문 키보드 기준 ASCII 한 글자 → [키코드, 수식키]
function asciiKey(c) {
  if (c >= 'a' && c <= 'z') return [0x04 + c.charCodeAt(0) - 97, 0];
  if (c >= 'A' && c <= 'Z') return [0x04 + c.charCodeAt(0) - 65, 2];
  if (c >= '1' && c <= '9') return [0x1E + c.charCodeAt(0) - 49, 0];
  if (c === '0') return [0x27, 0];
  if (c === ' ') return [0x2C, 0];
  if (c === '\n') return [0x28, 0];
  const plain = "-=[]\\;'`,./", shifted = '_+{}|:"~<>?', num = '!@#$%^&*()';
  const pk = [0x2D, 0x2E, 0x2F, 0x30, 0x31, 0x33, 0x34, 0x35, 0x36, 0x37, 0x38];
  let i;
  if ((i = plain.indexOf(c)) >= 0) return [pk[i], 0];
  if ((i = shifted.indexOf(c)) >= 0) return [pk[i], 2];
  if ((i = num.indexOf(c)) >= 0) return [i === 9 ? 0x27 : 0x1E + i, 2];
  return null;
}
// [이름, 키코드, 수식키]  수식키: 1=Ctrl 2=Shift 4=Alt 8=Win
const HAN_KEYS = [['한/영 키', 0x90, 0], ['오른쪽 Alt', 0xE6, 0], ['Shift + Space', 0x2C, 2], ['Ctrl + Space', 0x2C, 1], ['Win + Space', 0x2C, 8], ['Alt + Shift', 0xE1, 4]];
function sendToggle(d, idx) { const [, k, m] = HAN_KEYS[idx ?? store.hanKey ?? 0]; d.write([OP.KEY_TAP, k, m], true); }
const JAMO_KEY = (() => {
  const plain = 'ㅂqㅈwㄷeㄱrㅅtㅛyㅕuㅑiㅐoㅔpㅁaㄴsㅇdㄹfㅎgㅗhㅓjㅏkㅣlㅋzㅌxㅊcㅍvㅠbㅜnㅡm';
  const shift = 'ㅃqㅉwㄸeㄲrㅆtㅒoㅖp';
  const m = {};
  for (let i = 0; i < plain.length; i += 2) m[plain[i]] = [[0x04 + plain.charCodeAt(i + 1) - 97, 0]];
  for (let i = 0; i < shift.length; i += 2) m[shift[i]] = [[0x04 + shift.charCodeAt(i + 1) - 97, 2]];
  const combo = { ㅘ: 'ㅗㅏ', ㅙ: 'ㅗㅐ', ㅚ: 'ㅗㅣ', ㅝ: 'ㅜㅓ', ㅞ: 'ㅜㅔ', ㅟ: 'ㅜㅣ', ㅢ: 'ㅡㅣ',
    ㄳ: 'ㄱㅅ', ㄵ: 'ㄴㅈ', ㄶ: 'ㄴㅎ', ㄺ: 'ㄹㄱ', ㄻ: 'ㄹㅁ', ㄼ: 'ㄹㅂ', ㄽ: 'ㄹㅅ', ㄾ: 'ㄹㅌ', ㄿ: 'ㄹㅍ', ㅀ: 'ㄹㅎ', ㅄ: 'ㅂㅅ' };
  for (const [c, parts] of Object.entries(combo)) m[c] = [...parts].flatMap(p => m[p]);
  return m;
})();
const CHO = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ', JUNG = 'ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ', JONG = ' ㄱㄲㄳㄴㄵㄶㄷㄹㄺㄻㄼㄽㄾㄿㅀㅁㅂㅄㅅㅆㅇㅈㅊㅋㅌㅍㅎ';
function hangulKeys(ch) {
  const c = ch.charCodeAt(0);
  if (c >= 0xAC00 && c <= 0xD7A3) {
    const s = c - 0xAC00, jong = s % 28;
    return [...JAMO_KEY[CHO[Math.floor(s / 588)]], ...JAMO_KEY[JUNG[Math.floor((s % 588) / 28)]], ...(jong ? JAMO_KEY[JONG[jong]] : [])];
  }
  return JAMO_KEY[ch] || null;
}
// 글자를 [한글 묶음 / 영문 묶음]으로 나눔. han: true=한글 모드 필요, false=영어 모드 필요, null=어느 모드든 됨(숫자·기호·공백)
function splitHangul(t) {
  const out = [];
  for (const ch of t) {
    const hk = hangulKeys(ch);
    let seg;
    if (hk) seg = { han: true, keys: hk };
    else if (/[A-Za-z]/.test(ch)) seg = { han: false, text: ch };
    else if (/[\x20-\x7E\n]/.test(ch)) seg = { han: null, text: ch };
    else return null;
    const last = out[out.length - 1];
    if (last && seg.han === true && last.han === true) last.keys.push(...seg.keys);
    else if (last && seg.han !== true && last.han !== true && (seg.han === null || last.han === null || seg.han === last.han)) {
      last.text += seg.text; if (last.han === null) last.han = seg.han;
    } else out.push(seg);
  }
  return out;
}

function bindTouchpad() {
  const pad = $('#touchpad'), pts = new Map();
  let downAt = 0, moved = 0, lastY = null, dragging = false;
  const syncSens = () => $$('.sens button').forEach(b => b.setAttribute('aria-pressed', Math.abs(+b.dataset.sens - store.sens) < 0.3));
  $$('.sens button').forEach(b => {
    b.addEventListener('pointerdown', (e) => e.stopPropagation());
    b.onclick = (e) => { e.stopPropagation(); store.sens = +b.dataset.sens; save(); syncSens(); };
  });
  syncSens();
  pad.addEventListener('pointerdown', (e) => {
    pad.setPointerCapture(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    pad.classList.add('active');
    if (pts.size === 1) { downAt = performance.now(); moved = 0; }
    lastY = null;
  });
  pad.addEventListener('pointermove', (e) => {
    const p = pts.get(e.pointerId); if (!p) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
    moved += Math.abs(dx) + Math.abs(dy);
    if (pts.size === 1) {
      const s = store.sens, acc = 1 + Math.min(2, Math.hypot(dx, dy) / 12); // 빠르게 끌수록 멀리
      targets().forEach(d => d.queueMove(dx * s * acc, dy * s * acc, 0));
    } else if (pts.size === 2) {
      const ys = [...pts.values()].reduce((a, q) => a + q.y, 0) / 2;
      if (lastY !== null) { const w = (lastY - ys) / 18; targets().forEach(d => d.queueMove(0, 0, w)); }
      lastY = ys;
    }
  });
  const up = (e) => {
    if (!pts.has(e.pointerId)) return;
    pts.delete(e.pointerId);
    if (pts.size === 0) {
      pad.classList.remove('active');
      if (performance.now() - downAt < 220 && moved < 10) sendRaw(d => d.write([OP.CLICK, 1]));
    }
  };
  pad.addEventListener('pointerup', up); pad.addEventListener('pointercancel', up);
  $('#lclick').onclick = () => sendRaw(d => d.write([OP.CLICK, 1]));
  $('#rclick').onclick = () => sendRaw(d => d.write([OP.CLICK, 2]));
  $('#dragBtn').onclick = (e) => {
    dragging = !dragging; e.currentTarget.setAttribute('aria-pressed', dragging);
    e.currentTarget.textContent = dragging ? '끌기 해제' : '끌기 고정';
    sendRaw(d => d.write([dragging ? OP.MDOWN : OP.MUP, 1]));
  };
  const sendText = () => {
    const t = $('#textIn').value;
    if (!t) return;
    const segs = splitHangul(t);
    if (!segs) { ui.toast('한글·영문·숫자·기호만 보낼 수 있어요.'); return; }
    sendRaw(d => {
      let han = !!(store.hanState || {})[d.id];
      for (const s of segs) {
        if (s.han !== null && s.han !== han) { sendToggle(d); han = s.han; }
        if (s.han) for (const [k, m] of s.keys) d.write([OP.KEY_TAP, k, m], true);
        else { const max = d.payloadMax - 1; for (let i = 0; i < s.text.length; i += max) d.write([OP.TEXT, ...enc.encode(s.text.slice(i, i + max))], true); }
      }
      setHan(d, han);
    });
    ui.toast(`${t.length}글자를 보냈어요`); $('#textIn').value = '';
  };
  // 한/영 전환
  const renderHan = () => {
    const d = dongles.get(current); const han = d ? !!(store.hanState || {})[d.id] : false;
    const b = $('#hanBtn'); b.textContent = han ? '가' : 'A'; b.classList.toggle('ko', han);
    b.setAttribute('aria-label', `한/영 전환 (지금 ${han ? '한글' : '영어'})`);
  };
  const setHan = (d, v) => { store.hanState = store.hanState || {}; store.hanState[d.id] = v; save(); renderHan(); };
  // 한/영이 반대로 나올 때: 앱이 알고 있는 TV 상태만 뒤집음 (TV에는 아무것도 보내지 않음)
  const flipHan = () => {
    const d = dongles.get(current); if (!d) return;
    const now = !(store.hanState || {})[d.id];
    setHan(d, now);
    $('#textIn').value = ''; prev = '';
    ui.toast(`맞췄어요. TV가 지금 ${now ? '한글' : '영어'} 상태라고 보고 입력해요. 다시 쳐 주세요.`);
    $('#textIn').focus();
  };
  $('#hanFlip').onclick = flipHan;

  $('#hanBtn').onclick = () => sendRaw(d => { sendToggle(d); setHan(d, !(store.hanState || {})[d.id]); });
  $('#hanMore').onclick = () => {
    const sel = store.hanKey ?? 0;
    openSheet(`<h3>한/영 설정</h3>
      <div class="macro"><div class="nm">입력 버튼의 가/A 표시가 TV와 다를 때<small>표시만 바꾸고 TV에는 아무것도 보내지 않아요</small></div><button class="btn sm" data-fix>표시 바꾸기</button></div>
      <span class="label">전환 방법 (TV마다 한 번)</span>
      <p style="margin:0;color:var(--muted);font-size:13px">TV의 글자 입력 칸을 열고 하나씩 ‘시험’하세요. <b style="color:var(--fg)">안녕</b>이 나오면 맞는 방법이에요. <b style="color:var(--fg)">dkssud</b>가 나오면 다음 것을 시험하세요.</p>
      <div class="grid" style="gap:8px">${HAN_KEYS.map(([n], i) => `<div class="macro"><div class="nm">${esc(n)}${i === sel ? ' <span class="cur">사용 중</span>' : ''}</div>
        <button class="btn sm" data-ht="${i}">시험</button><button class="btn sm primary" data-hu="${i}">이걸로</button></div>`).join('')}</div>
      <button class="btn" data-x>닫기</button>`, (s, close) => {
      $('[data-x]', s).onclick = close;
      $('[data-fix]', s).onclick = () => { close(); flipHan(); };
      $$('[data-ht]', s).forEach(b => b.onclick = () => sendRaw(d => {
        sendToggle(d, +b.dataset.ht);
        for (const k of 'dkssud') d.write([OP.KEY_TAP, 0x04 + k.charCodeAt(0) - 97, 0], true);
        ui.toast('보냈어요. TV 입력 칸을 확인하세요.');
      }));
      $$('[data-hu]', s).forEach(b => b.onclick = () => { store.hanKey = +b.dataset.hu; save(); close(); ui.toast(`한/영 전환: ${HAN_KEYS[+b.dataset.hu][0]}`); });
    });
  };
  $$('nav.tabs [data-tab="pad"]').forEach(b => b.addEventListener('click', renderHan));
  renderHan();
  // ---- 실시간 입력: 휴대폰에서 치는 대로 바로 TV에 입력 ----
  const live = true; let prev = '';
  const syncLive = () => {
    $('#textSend').textContent = '엔터';
    $('#textIn').placeholder = '여기에 치면 TV에 바로 입력돼요';
  };
  const BS = 0x2A;
  // 한 글자 → [{k,m,han}] (han: true=한글 모드, false=영어 모드, null=상관없음)
  const charKeys = (ch) => {
    const hk = hangulKeys(ch);
    if (hk) return hk.map(([k, m]) => ({ k, m, han: true }));
    const a = asciiKey(ch);
    if (a) return [{ k: a[0], m: a[1], han: /[A-Za-z]/.test(ch) ? false : null }];
    return null;
  };
  const strKeys = (s) => { const out = []; for (const ch of s) { const k = charKeys(ch); if (!k) return null; out.push(...k); } return out; };
  const typeKeys = (d, list) => {
    let han = !!(store.hanState || {})[d.id];
    for (const x of list) {
      if (x.han !== null && x.han !== han) { sendToggle(d); han = x.han; }
      d.write([OP.KEY_TAP, x.k, x.m], true);
    }
    store.hanState = store.hanState || {}; store.hanState[d.id] = han; save();
  };
  const liveSend = () => {
    const now = $('#textIn').value;
    if (now === prev) return;
    let p = 0; const a = [...prev], b = [...now];
    while (p < a.length && p < b.length && a[p] === b[p]) p++;
    const oldTail = a.slice(p).join(''), newTail = b.slice(p).join('');
    const kOld = strKeys(oldTail) || [], kNew = strKeys(newTail);
    if (!kNew) { ui.toast('보낼 수 없는 글자가 있어요'); $('#textIn').value = prev; return; }
    const isPrefix = (x, y) => x.length <= y.length && x.every((v, i) => v.k === y[i].k && v.m === y[i].m);
    sendRaw(d => {
      if (isPrefix(kOld, kNew)) typeKeys(d, kNew.slice(kOld.length));                       // 이어서 치기 (한글 조합 포함)
      else if (isPrefix(kNew, kOld) && [...oldTail].length === [...newTail].length) {         // 조합 중인 글자에서 자모 지우기
        for (let i = 0; i < kOld.length - kNew.length; i++) d.write([OP.KEY_TAP, BS, 0], true);
      } else {                                                                              // 글자 지우기·바꾸기
        for (let i = 0; i < [...oldTail].length; i++) d.write([OP.KEY_TAP, BS, 0], true);
        typeKeys(d, kNew);
      }
    });
    prev = now; renderHan();
  };
  $('#textIn').addEventListener('input', () => { if (live) liveSend(); });
  $('#textIn').addEventListener('keydown', (e) => {
    if (live && (e.key === 'Backspace' || e.keyCode === 8) && $('#textIn').value === '') { sendRaw(d => d.write([OP.KEY_TAP, BS, 0], true)); }
    if (e.key === 'Enter') { e.preventDefault(); live ? liveEnter() : sendText(); }
  });
  const liveEnter = () => { liveSend(); sendRaw(d => d.write([OP.KEY_TAP, 0x28, 0], true)); $('#textIn').value = ''; prev = ''; };
  $('#textSend').onclick = () => live ? liveEnter() : sendText();
  syncLive();
}

let picOpenAt = 0;   // 마지막으로 밝기 칸을 조작한 시각 (최근이면 메뉴가 열려 있다고 봄)
function startPathRec(target) {
  if (!dongles.get(current)) { ui.toast('TV를 먼저 선택해 주세요.'); return; }
  recording = { steps: [], last: Date.now(), target }; ui.renderRec(); ui.renderMacros();
  ui.toast('아래 버튼으로 메뉴를 이동하세요. 설정 버튼부터 시작해요.');
}
async function runPath(steps) {
  for (const s of steps) { await sleep(Math.max(250, Math.min(s.wait || 0, 1200))); runAction(s.act, { fromMacro: true }); }
  await sleep(400);
}
function bindPicture() {
  store.picTarget = store.picTarget || 'bright';
  const syncTarget = () => { $$('#picTarget button').forEach(b => b.setAttribute('aria-pressed', b.dataset.pt === store.picTarget)); ui.renderMacros(); };
  $$('#picTarget button').forEach(b => b.onclick = () => { store.picTarget = b.dataset.pt; save(); picOpenAt = 0; syncTarget(); });
  const setMult = (n) => { store.mult = n; save(); $$('#multBtns button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.n === n)); };
  setMult([1, 5, 10].includes(store.mult) ? store.mult : 5);
  $$('#multBtns button').forEach(b => b.onclick = () => setMult(+b.dataset.n));
  let busy = false;
  const adjust = async (act) => {
    if (busy) return;
    const d = dongles.get(current); if (!d) { ui.toast('TV를 먼저 선택해 주세요.'); return; }
    busy = true;
    try {
      const pt = store.picTarget, path = (cfgOf(d.id).paths || {})[pt];
      const up = act === 'right';
      if (path && path.length) {
        // 저장한 메뉴 길로 조절 칸을 연 뒤 ◀/▶
        if (Date.now() - picOpenAt > 20000) { ui.toast('조절 칸을 여는 중…'); await runPath(path); }
        for (let i = 0; i < store.mult; i++) { runAction(act, { fromMacro: true }); await sleep(120); }
        picOpenAt = Date.now();
      } else if (pt === 'bright') {
        // 메뉴 길이 없으면 밝기 키(USB·블루투스 표준 키)를 바로 보냄. 방향키는 보내지 않음
        for (let i = 0; i < store.mult; i++) { runAction(up ? 'brup' : 'brdown', { fromMacro: true }); await sleep(120); }
        if (!store.brHint) { store.brHint = 1; save(); ui.toast('밝기 키를 보냈어요. TV가 그대로면 아래 ‘메뉴 길 저장’을 해 주세요.'); }
      } else {
        // 명암은 표준 키가 없어 메뉴 길이 꼭 필요함
        openSheet(`<h3>명암 메뉴 길 저장</h3>
          <p>명암은 TV 메뉴 안에서만 바꿀 수 있어요. TV의 명암 조절 칸까지 가는 길을 한 번만 알려 주세요.</p>
          <ol class="tips">
            <li>‘저장 시작’을 누르고, 아래 버튼(설정·▲▼◀▶·확인)으로 TV의 <b>명암</b> 조절 칸까지 이동</li>
            <li>도착하면 위쪽 ‘여기서 저장’</li>
            <li>이후엔 +/−만 누르면 자동으로 그 칸을 열고 조절해요</li>
          </ol>
          <div class="row"><button class="btn grow" data-x>닫기</button><button class="btn primary grow" data-go>저장 시작</button></div>`,
          (s, close) => { $('[data-x]', s).onclick = close; $('[data-go]', s).onclick = () => { close(); startPathRec('contrast'); }; });
      }
    } finally { busy = false; }
  };
  $('#adjDown').onclick = () => adjust('left');
  $('#adjUp').onclick = () => adjust('right');
  $('#adjClose').onclick = async () => { picOpenAt = 0; runAction('exit', { fromMacro: true }); };
  $('#recCancel').onclick = () => { recording = null; ui.renderRec(); ui.renderMacros(); };
  $('#recStop').onclick = () => {
    const rec = recording; recording = null; ui.renderRec();
    if (!rec || !rec.steps.length) { ui.toast('누른 버튼이 없어요.'); ui.renderMacros(); return; }
    const c = cfgOf(current); c.paths = c.paths || {};
    c.paths[rec.target] = rec.steps; save();
    picOpenAt = Date.now();   // 지금 그 칸에 있음
    ui.renderMacros(); ui.toast(`${rec.target === 'bright' ? '밝기' : '명암'} 메뉴 길을 저장했어요. 이제 +/−만 누르면 돼요.`);
  };
  $('#tipBtn').onclick = () => openSheet(`<h3>카메라 플리커 줄이는 법</h3>
    <ul class="tips">
      <li><b>밝기(백라이트)는 높게</b> 두고, 너무 밝으면 <b>명암</b>으로 낮추세요. 백라이트를 낮추면 깜빡임(PWM)이 생기는 TV가 많아요.</li>
      <li>그래도 밝으면 화면에 <b>ND 필름</b>을 붙이거나 소품 이미지를 어둡게 만드세요.</li>
      <li><b>절전·에코 모드, 자동 밝기, 동작 보정</b>은 끄세요.</li>
      <li>화면 모드는 <b>영화·필름메이커 모드</b>가 가장 안정적이에요.</li>
      <li>24fps에서 줄이 보이면 셔터를 <b>1/60(144°)</b> 쪽으로 맞춰 보세요.</li>
    </ul><button class="btn" data-x>닫기</button>`, (s, close) => { $('[data-x]', s).onclick = close; });
  syncTarget();
}

/* ---------------- 클리커 ---------------- */
// 키: [HID 키코드, 수식키]  수식키 비트: 1=Ctrl 2=Shift 4=Alt 8=Cmd/Win
const K = { right: 0x4F, left: 0x50, esc: 0x29, enter: 0x28, f5: 0x3E, f11: 0x44, b: 0x05, w: 0x1A, l: 0x0F, p: 0x13, home: 0x4A, end: 0x4D };
const CLK_PROGS = {
  ppt_win: { label: '파워포인트 (Windows)', jump: true, keys: [
    ['처음부터 시작', [K.f5, 0]], ['현재 장부터', [K.f5, 2]], ['발표 끝내기', [K.esc, 0]],
    ['검은 화면', [K.b, 0]], ['흰 화면', [K.w, 0]], ['레이저 켜기/끄기', [K.l, 1]],
    ['첫 장', [K.home, 0]], ['마지막 장', [K.end, 0]] ] },
  ppt_mac: { label: '파워포인트 (Mac)', jump: true, keys: [
    ['처음부터 시작', [K.enter, 8 | 2]], ['현재 장부터', [K.enter, 8]], ['발표 끝내기', [K.esc, 0]],
    ['검은 화면', [K.b, 0]], ['흰 화면', [K.w, 0]], ['레이저 켜기/끄기', [K.l, 8]],
    ['첫 장', [K.home, 0]], ['마지막 장', [K.end, 0]] ] },
  keynote: { label: '키노트 (Mac)', jump: true, keys: [
    ['발표 시작', [K.p, 8 | 4]], ['발표 끝내기', [K.esc, 0]], ['검은 화면', [K.b, 0]],
    ['흰 화면', [K.w, 0]], ['첫 장', [K.home, 0]], ['마지막 장', [K.end, 0]] ] },
  gslides: { label: '구글 슬라이드', jump: false, keys: [
    ['처음부터 시작', [K.f5, 1 | 2]], ['현재 장부터', [K.f5, 1]], ['발표 끝내기', [K.esc, 0]],
    ['검은 화면', [K.b, 0]], ['흰 화면', [K.w, 0]], ['첫 장', [K.home, 0]], ['마지막 장', [K.end, 0]] ] },
  board: { label: '전자칠판 (안드로이드)', jump: false, keys: [
    ['홈', ['cc', 0x223]], ['뒤로', ['cc', 0x224]], ['앱 전환', [0x2B, 4]],
    ['검은 화면', [K.b, 0]], ['첫 장', [K.home, 0]], ['마지막 장', [K.end, 0]] ] },
  other: { label: '사진 보기·PDF·기타', jump: false, keys: [
    ['전체 화면', [K.f11, 0]], ['나가기', [K.esc, 0]], ['첫 장', [K.home, 0]], ['마지막 장', [K.end, 0]] ] },
};
function clickerPackets(d, dir) {
  const st = store.clk || {};
  if (st.mode === 'tv') return packetsFor(d, resolve(d, dir > 0 ? 'right' : 'left'), true);
  return [{ b: [OP.KEY_TAP, dir > 0 ? K.right : K.left, 0], r: false }];
}
const CLK_TV_KEYS = [['슬라이드쇼 재생', 'play'], ['일시정지', 'pause'], ['확인', 'ok'], ['뒤로', 'back'], ['정지', 'stop'], ['홈', 'home']];

// 클리커에 보일 핵심 버튼 3개 (프로그램별)  [표시 이름, CLK_PROGS 안의 이름]
const CLK_CORE = {
  ppt_win: [['시작', '처음부터 시작'], ['검은 화면', '검은 화면'], ['끝내기', '발표 끝내기']],
  ppt_mac: [['시작', '처음부터 시작'], ['검은 화면', '검은 화면'], ['끝내기', '발표 끝내기']],
  keynote: [['시작', '발표 시작'], ['검은 화면', '검은 화면'], ['끝내기', '발표 끝내기']],
  gslides: [['시작', '처음부터 시작'], ['검은 화면', '검은 화면'], ['끝내기', '발표 끝내기']],
  board: [['홈', '홈'], ['뒤로', '뒤로'], ['검은 화면', '검은 화면']],
  other: [['전체 화면', '전체 화면'], ['첫 장', '첫 장'], ['나가기', '나가기']],
};
const CLK_TV_CORE = [['재생', 'play'], ['확인', 'ok'], ['뒤로', 'back']];

function bindClicker() {
  const st = store.clk = Object.assign({ mode: 'pc', prog: 'ppt_win' }, store.clk || {});
  const sel = $('#clkProg');
  sel.innerHTML = Object.entries(CLK_PROGS).map(([k, p]) => `<option value="${k}">${p.label}</option>`).join('');
  sel.value = st.prog;
  const pcKey = ([k, m]) => sendRaw(d => k === 'cc' ? d.write([OP.CC_TAP, m & 0xFF, m >> 8]) : d.write([OP.KEY_TAP, k, m]));
  const render = () => {
    $$('#clkMode button').forEach(b => b.setAttribute('aria-pressed', b.dataset.cm === st.mode));
    const pc = st.mode === 'pc', prog = CLK_PROGS[st.prog];
    sel.hidden = !pc;
    const box = $('#clkKeys'); box.innerHTML = '';
    const list = pc ? CLK_CORE[st.prog].map(([lab, name]) => [lab, (prog.keys.find(k => k[0] === name) || [])[1]]) : CLK_TV_CORE;
    for (const [label, v] of list) {
      if (!v) continue;
      const b = document.createElement('button'); b.className = 'key'; b.textContent = label;
      b.onclick = () => { if (pc) pcKey(v); else runAction(v); };
      box.appendChild(b);
    }
  };
  const step = (dir) => {
    if (!targets().length) { runAction('right'); return; } // 연결 안내 토스트
    if (navigator.vibrate) navigator.vibrate(dir > 0 ? 18 : [8, 40, 8]);
    if (st.mode === 'pc') pcKey([dir > 0 ? K.right : K.left, 0]);
    else runAction(dir > 0 ? 'right' : 'left');
  };
  $('#clkNext').onclick = () => step(1);
  $('#clkPrev').onclick = () => step(-1);
  window.__clk = { count: () => {} };
  if (NATIVE) {
    $('#volCard').hidden = false;
    const sync = () => { $('#volBtn').setAttribute('aria-pressed', !!st.volume); $('#volBtn').textContent = st.volume ? '켬' : '끔'; };
    $('#volBtn').onclick = () => { st.volume = !st.volume; save(); sync(); pushVolumeConfig(); ui.toast(st.volume ? '볼륨 버튼으로 넘깁니다' : '볼륨 버튼이 원래대로 돌아왔어요'); };
    sync();
  }
  $$('#clkMode button').forEach(b => b.onclick = () => { st.mode = b.dataset.cm; save(); render(); pushVolumeConfig(); });
  sel.onchange = () => { st.prog = sel.value; save(); render(); pushVolumeConfig(); };
  render();
}

function switchTab(name) {
  $$('nav.tabs [data-tab]').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === name));
  ['remote', 'pad', 'clk', 'pic', 'set'].forEach(t => { $('#v-' + t).hidden = t !== name; });
  try { sessionStorage.setItem('fr.tab', name); } catch (e) {}
}

let wakeLock = null;
let nativeWake = false;
async function toggleWake(btn) {
  if (NATIVE) { nativeWake = !nativeWake; Native.keepScreenOn(nativeWake); btn.setAttribute('aria-pressed', nativeWake); btn.textContent = nativeWake ? '켬' : '끔'; return; }
  try {
    if (wakeLock) { await wakeLock.release(); wakeLock = null; }
    else { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; syncWake(btn); }); }
  } catch (e) { ui.toast('이 화면에서는 꺼짐 방지를 쓸 수 없어요.'); }
  syncWake(btn);
}
function syncWake(btn) { btn.setAttribute('aria-pressed', !!wakeLock); btn.textContent = wakeLock ? '켬' : '끔'; }

/* ---------------- 시작 ---------------- */
function init() {
  $$('nav.tabs [data-tab]').forEach(b => b.onclick = () => switchTab(b.dataset.tab));
  let tab = 'remote'; try { tab = sessionStorage.getItem('fr.tab') || 'remote'; } catch (e) {}
  switchTab(tab);
  $('#groupBtn').onclick = (e) => {
    groupMode = !groupMode; e.currentTarget.setAttribute('aria-pressed', groupMode);
    selected.clear(); if (groupMode) dongles.forEach((d, id) => { if (d.state === 'on') selected.add(id); });
    ui.render(); ui.toast(groupMode ? '선택한 TV 모두에 보냅니다. TV를 눌러 넣고 빼세요.' : '한 대씩 제어합니다');
  };
  $('#addBtn2').onclick = addDongle;
  $('#demoBtn').onclick = addDemo;
  if (NATIVE) {
    $('#phoneKbBtn').hidden = false; $('#phoneKbBtn').onclick = addPhoneKb;
    $('#updRow').hidden = false;
    try { $('#verText').textContent = `지금 버전: HW 리모컨 ${Native.versionCode()}`; } catch (e) {}
    $('#updCheck').onclick = () => upd.check(true);
    $('#updGo').onclick = () => { if (upd.url) { upd.show('준비하는 중…', ''); Native.installUpdate(upd.url); } };
    $('#updLater').onclick = () => { $('#updBanner').hidden = true; };
    setTimeout(() => upd.check(false), 1500);   // 켤 때마다 조용히 확인
  }
  $('#wakeBtn').onclick = (e) => toggleWake(e.currentTarget);
  bindKeys(); bindTouchpad(); bindPicture(); bindClicker();
  document.addEventListener('visibilitychange', () => {
    if (!NATIVE && document.visibilityState === 'visible' && $('#wakeBtn').getAttribute('aria-pressed') === 'true' && !wakeLock) toggleWake($('#wakeBtn'));
  });
  const p = btProblem();
  if (p) {
    const b = $('#btBanner'); b.hidden = false;
    b.innerHTML = `<div>${p}</div><div class="row"><button class="btn sm primary" id="demoNow">데모 TV로 둘러보기</button></div>`;
    $('#demoNow').onclick = () => { addDemo(); b.hidden = true; };
  }
  ui.render(); restore();
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
}
init();
</script>
